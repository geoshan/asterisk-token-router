<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR Logo v16 · 大弧度纠正</title>
<style>
  :root { --bg:#0a0e17; --card-bg:#121621; --border:#1e2533; --text:#8896ab; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px; min-height: 100vh;
  }
  h1 { font-size:1.8rem; font-weight:700; color:#fff; margin-bottom:4px; }
  .sub { color:#6b7c93; font-size:0.85rem; margin-bottom:40px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 60px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    max-width: 420px; width: 100%;
  }
  .label { font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.1em; color:#5b8def; }
  .logo-box { width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
  .note { font-size:0.75rem; color:#5b6d8a; text-align:center; line-height:1.6; max-width:320px; }
</style>
</head>
<body>
  <h1>Asterisk Token Router · v16</h1>
  <p class="sub">Q = 30 · 最大弧度 · 黑框芯片</p>

  <div class="card">
    <div class="label">弯弧路由</div>
    <div class="logo-box">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <defs>
          <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- Q Y=30 → strong upward bow, then descend to chip -->
        <g fill="none" stroke-width="17" stroke-linecap="round">
          <path d="M50,40 Q120,30 96,86"  stroke="#4ade80" filter="url(#g)"/>
          <path d="M190,40 Q120,30 144,86" stroke="#4ade80" filter="url(#g)"/>
          <path d="M50,200 Q120,210 96,154" stroke="#7aa2ff" filter="url(#g)"/>
          <path d="M190,200 Q120,210 144,154" stroke="#7aa2ff" filter="url(#g)"/>
        </g>

        <g filter="url(#g)">
          <circle cx="50" cy="40" r="12" fill="#4ade80"/>
          <circle cx="190" cy="40" r="12" fill="#4ade80"/>
          <circle cx="50" cy="200" r="12" fill="#7aa2ff"/>
          <circle cx="190" cy="200" r="12" fill="#7aa2ff"/>
        </g>

        <!-- Black-frame chip -->
        <g filter="url(#g)">
          <rect x="76" y="76" width="88" height="88" rx="10" fill="#0a0e17" stroke="#0a0e17" stroke-width="5.5"/>
          <rect x="94" y="94" width="52" height="52" rx="6" fill="#121621" stroke="#7aa2ff" stroke-width="3"/>
          <circle cx="120" cy="120" r="11" fill="#4ade80"/>
          <g fill="#f0c850" opacity="0.85">
            <rect x="107" y="65" width="5" height="11" rx="2"/><rect x="128" y="65" width="5" height="11" rx="2"/>
            <rect x="107" y="164" width="5" height="11" rx="2"/><rect x="128" y="164" width="5" height="11" rx="2"/>
            <rect x="65" y="107" width="11" height="5" rx="2"/><rect x="65" y="128" width="11" height="5" rx="2"/>
            <rect x="164" y="107" width="11" height="5" rx="2"/><rect x="164" y="128" width="11" height="5" rx="2"/>
          </g>
        </g>

        <circle cx="96" cy="86" r="3.5" fill="#4ade80"/>
        <circle cx="144" cy="86" r="3.5" fill="#4ade80"/>
        <circle cx="96" cy="154" r="3.5" fill="#7aa2ff"/>
        <circle cx="144" cy="154" r="3.5" fill="#7aa2ff"/>
      </svg>
    </div>
    <p class="note">
      Q Y=30 大弧度（v7=45, v15=80 推错方向）<br>
      绿色冲高再落下 · 蓝色深抛再弹起<br>
      芯片黑色外框融入背景
    </p>
  </div>
</body>
</html>
