<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR Logo v7 · 弧线分离</title>
<style>
  :root {
    --bg: #0a0e17;
    --card-bg: #121621;
    --border: #1e2533;
    --text: #8896ab;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px; min-height: 100vh;
  }
  h1 { font-size:1.8rem; font-weight:700; color:#fff; margin-bottom:4px; }
  .sub { color:#6b7c93; font-size:0.85rem; margin-bottom:40px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 60px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    max-width: 420px; width: 100%; margin-bottom: 24px;
  }
  .label { font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.1em; color:#5b8def; }
  .logo-box { width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
  .note { font-size:0.75rem; color:#5b6d8a; text-align:center; line-height:1.6; max-width:320px; }
  .variants {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 20px; margin-top: 40px; max-width: 360px; width: 100%;
  }
  .vcard {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .vlabel { font-size:0.7rem; color:#6b7c93; text-transform:uppercase; letter-spacing:0.08em; }
  .vcard .logo-box { width: 120px; height: 120px; }
</style>
</head>
<body>
  <h1>Asterisk Token Router · v7</h1>
  <p class="sub">弧线分流 — 分别接入芯片上下两侧</p>

  <!-- Main: arcs hit chip at 4 separate points -->
  <div class="card">
    <div class="label">推荐 · 分流接入</div>
    <div class="logo-box">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0c850"/>
            <stop offset="100%" stop-color="#d4a020"/>
          </linearGradient>
          <linearGradient id="blue" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5b8def"/>
            <stop offset="100%" stop-color="#3060bf"/>
          </linearGradient>
          <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- Arc 1: top-left → chip top (offset left) -->
        <path d="M50,50 Q120,35 98,90" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" filter="url(#g)"/>
        <!-- Arc 2: top-right → chip top (offset right) -->
        <path d="M190,50 Q120,35 142,90" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" filter="url(#g)"/>
        <!-- Arc 3: bottom-left → chip bottom (offset left) -->
        <path d="M50,190 Q120,205 98,150" fill="none" stroke="url(#blue)" stroke-width="14" stroke-linecap="round" filter="url(#g)"/>
        <!-- Arc 4: bottom-right → chip bottom (offset right) -->
        <path d="M190,190 Q120,205 142,150" fill="none" stroke="url(#blue)" stroke-width="14" stroke-linecap="round" filter="url(#g)"/>

        <!-- Endpoint dots -->
        <g filter="url(#g)">
          <circle cx="50" cy="50" r="13" fill="url(#gold)"/>
          <circle cx="190" cy="50" r="13" fill="url(#gold)"/>
          <circle cx="50" cy="190" r="13" fill="url(#blue)"/>
          <circle cx="190" cy="190" r="13" fill="url(#blue)"/>
        </g>

        <!-- CHIP — wider this time -->
        <g filter="url(#g)">
          <rect x="82" y="82" width="76" height="76" rx="6" fill="#0a0e17" stroke="url(#gold)" stroke-width="4"/>
          <rect x="97" y="97" width="46" height="46" rx="3" fill="#121621" stroke="#5b8def" stroke-width="3"/>
          <circle cx="120" cy="120" r="10" fill="url(#gold)"/>

          <!-- Pins: top (left group + right group, gap in middle) -->
          <g fill="#5b8def" opacity="0.85">
            <!-- top-left group (arc 1 hits here) -->
            <rect x="89" y="72" width="4" height="10" rx="1.5"/>
            <rect x="97" y="72" width="4" height="10" rx="1.5"/>
            <!-- top-right group (arc 2 hits here) -->
            <rect x="139" y="72" width="4" height="10" rx="1.5"/>
            <rect x="147" y="72" width="4" height="10" rx="1.5"/>
            <!-- bottom-left group (arc 3 hits here) -->
            <rect x="89" y="158" width="4" height="10" rx="1.5"/>
            <rect x="97" y="158" width="4" height="10" rx="1.5"/>
            <!-- bottom-right group (arc 4 hits here) -->
            <rect x="139" y="158" width="4" height="10" rx="1.5"/>
            <rect x="147" y="158" width="4" height="10" rx="1.5"/>
            <!-- left pins -->
            <rect x="72" y="97" width="10" height="4" rx="1.5"/>
            <rect x="72" y="105" width="10" height="4" rx="1.5"/>
            <rect x="72" y="113" width="10" height="4" rx="1.5"/>
            <rect x="72" y="121" width="10" height="4" rx="1.5"/>
            <rect x="72" y="129" width="10" height="4" rx="1.5"/>
            <rect x="72" y="137" width="10" height="4" rx="1.5"/>
            <!-- right pins -->
            <rect x="158" y="97" width="10" height="4" rx="1.5"/>
            <rect x="158" y="105" width="10" height="4" rx="1.5"/>
            <rect x="158" y="113" width="10" height="4" rx="1.5"/>
            <rect x="158" y="121" width="10" height="4" rx="1.5"/>
            <rect x="158" y="129" width="10" height="4" rx="1.5"/>
            <rect x="158" y="137" width="10" height="4" rx="1.5"/>
          </g>
        </g>

        <!-- Small accent dots at arc-chip junctions -->
        <circle cx="98" cy="90" r="3" fill="#f0c850" opacity="0.8"/>
        <circle cx="142" cy="90" r="3" fill="#f0c850" opacity="0.8"/>
        <circle cx="98" cy="150" r="3" fill="#5b8def" opacity="0.8"/>
        <circle cx="142" cy="150" r="3" fill="#5b8def" opacity="0.8"/>
      </svg>
    </div>
    <p class="note">
      弧线不再聚于一点：分四路接入芯片<br>
      上方左右分开 · 下方左右分开<br>
      芯片顶部/底部引脚间隙 = 分流点
    </p>
  </div>

  <!-- Side by side comparison -->
  <p class="sub" style="margin-top:40px;">对比</p>
  <div class="variants" style="max-width:400px;">
    <div class="vcard">
      <div class="vlabel">v6 汇聚一点</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <g fill="none" stroke-width="16" stroke-linecap="round">
            <path d="M55,55 Q100,60 120,92" stroke="#f0c850"/>
            <path d="M185,55 Q140,60 120,92" stroke="#f0c850"/>
            <path d="M55,185 Q100,180 120,148" stroke="#5b8def"/>
            <path d="M185,185 Q140,180 120,148" stroke="#5b8def"/>
          </g>
          <circle cx="55" cy="55" r="14" fill="#f0c850"/>
          <circle cx="185" cy="55" r="14" fill="#f0c850"/>
          <circle cx="55" cy="185" r="14" fill="#5b8def"/>
          <circle cx="185" cy="185" r="14" fill="#5b8def"/>
          <rect x="82" y="82" width="76" height="76" rx="6" fill="#0a0e17" stroke="#f0c850" stroke-width="4"/>
          <rect x="98" y="98" width="44" height="44" rx="3" fill="#121621" stroke="#5b8def" stroke-width="3"/>
          <circle cx="120" cy="120" r="10" fill="#f0c850"/>
          <g fill="#5b8def" opacity="0.8">
            <rect x="97" y="72" width="4" height="10" rx="1"/><rect x="113" y="72" width="4" height="10" rx="1"/>
            <rect x="129" y="72" width="4" height="10" rx="1"/>
            <rect x="97" y="158" width="4" height="10" rx="1"/><rect x="113" y="158" width="4" height="10" rx="1"/>
            <rect x="129" y="158" width="4" height="10" rx="1"/>
            <rect x="72" y="97" width="10" height="4" rx="1"/><rect x="72" y="113" width="10" height="4" rx="1"/><rect x="72" y="129" width="10" height="4" rx="1"/>
            <rect x="158" y="97" width="10" height="4" rx="1"/><rect x="158" y="113" width="10" height="4" rx="1"/><rect x="158" y="129" width="10" height="4" rx="1"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="vcard">
      <div class="vlabel">v7 分开触达</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <g fill="none" stroke-width="16" stroke-linecap="round">
            <path d="M50,50 Q120,45 98,88" stroke="#f0c850"/>
            <path d="M190,50 Q120,45 142,88" stroke="#f0c850"/>
            <path d="M50,190 Q120,195 98,152" stroke="#5b8def"/>
            <path d="M190,190 Q120,195 142,152" stroke="#5b8def"/>
          </g>
          <circle cx="50" cy="50" r="14" fill="#f0c850"/>
          <circle cx="190" cy="50" r="14" fill="#f0c850"/>
          <circle cx="50" cy="190" r="14" fill="#5b8def"/>
          <circle cx="190" cy="190" r="14" fill="#5b8def"/>
          <rect x="82" y="82" width="76" height="76" rx="6" fill="#0a0e17" stroke="#f0c850" stroke-width="4"/>
          <rect x="97" y="97" width="46" height="46" rx="3" fill="#121621" stroke="#5b8def" stroke-width="3"/>
          <circle cx="120" cy="120" r="10" fill="#f0c850"/>
          <g fill="#5b8def" opacity="0.8">
            <rect x="89" y="72" width="4" height="10" rx="1"/><rect x="97" y="72" width="4" height="10" rx="1"/>
            <rect x="139" y="72" width="4" height="10" rx="1"/><rect x="147" y="72" width="4" height="10" rx="1"/>
            <rect x="89" y="158" width="4" height="10" rx="1"/><rect x="97" y="158" width="4" height="10" rx="1"/>
            <rect x="139" y="158" width="4" height="10" rx="1"/><rect x="147" y="158" width="4" height="10" rx="1"/>
            <rect x="72" y="97" width="10" height="4" rx="1"/><rect x="72" y="113" width="10" height="4" rx="1"/><rect x="72" y="129" width="10" height="4" rx="1"/>
            <rect x="158" y="97" width="10" height="4" rx="1"/><rect x="158" y="113" width="10" height="4" rx="1"/><rect x="158" y="129" width="10" height="4" rx="1"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
