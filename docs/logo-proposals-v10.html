<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR Logo v10 · 弧线流动</title>
<style>
  :root { --bg:#0a0e17; --card-bg:#121621; --border:#1e2533; --text:#8896ab; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px; min-height: 100vh;
  }
  h1 { font-size:1.8rem; font-weight:700; color:#fff; margin-bottom:4px; }
  .sub { color:#6b7c93; font-size:0.85rem; margin-bottom:40px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 60px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    max-width: 420px; width: 100%;
  }
  .label { font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.1em; color:#5b8def; }
  .logo-box { width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
  .note { font-size:0.75rem; color:#5b6d8a; text-align:center; line-height:1.6; max-width:320px; }
</style>
</head>
<body>
  <h1>Asterisk Token Router · v10</h1>
  <p class="sub">芯片放大 · 弧线纵深感 · 引脚换色</p>

  <div class="card">
    <div class="label">流动路由</div>
    <div class="logo-box">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f0c850"/>
            <stop offset="100%" stop-color="#d4a020"/>
          </linearGradient>
          <linearGradient id="blue" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#5b8def"/>
            <stop offset="100%" stop-color="#3060bf"/>
          </linearGradient>
          <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- 4 arcs — flowing vertical curves, overlapping chip partially -->
        <g fill="none" stroke-width="16" stroke-linecap="round">
          <!-- Top-left: swoop down and right, passes behind chip, ends below-right -->
          <path d="M46,52 Q90,88 120,120 Q150,152 194,188" stroke="url(#gold)" filter="url(#g)" opacity="0.35"/>
          <!-- Top-right: swoop down and left -->
          <path d="M194,52 Q150,88 120,120 Q90,152 46,188" stroke="url(#blue)" filter="url(#g)" opacity="0.35"/>
        </g>

        <!-- Main arcs — hit chip near corners -->
        <g fill="none" stroke-width="16" stroke-linecap="round">
          <path d="M50,46 Q96,72 96,92"  stroke="url(#gold)" filter="url(#g)"/>
          <path d="M190,46 Q144,72 144,92" stroke="url(#gold)" filter="url(#g)"/>
          <path d="M50,194 Q96,168 96,148" stroke="url(#blue)" filter="url(#g)"/>
          <path d="M190,194 Q144,168 144,148" stroke="url(#blue)" filter="url(#g)"/>
        </g>

        <!-- Endpoint dots -->
        <g filter="url(#g)">
          <circle cx="50" cy="46" r="12" fill="url(#gold)"/>
          <circle cx="190" cy="46" r="12" fill="url(#gold)"/>
          <circle cx="50" cy="194" r="12" fill="url(#blue)"/>
          <circle cx="190" cy="194" r="12" fill="url(#blue)"/>
        </g>

        <!-- LARGE chip: 80×80 -->
        <g filter="url(#g)">
          <rect x="80" y="80" width="80" height="80" rx="9" fill="#0a0e17" stroke="url(#gold)" stroke-width="5"/>
          <rect x="96" y="96" width="48" height="48" rx="5" fill="#121621" stroke="#5b8def" stroke-width="3"/>
          <circle cx="120" cy="120" r="10" fill="url(#gold)"/>

          <!-- Pins: cyan color to avoid arc clash -->
          <g fill="#38bdf8" opacity="0.9">
            <rect x="107" y="70" width="5" height="10" rx="2"/>
            <rect x="128" y="70" width="5" height="10" rx="2"/>
            <rect x="107" y="160" width="5" height="10" rx="2"/>
            <rect x="128" y="160" width="5" height="10" rx="2"/>
            <rect x="70" y="107" width="10" height="5" rx="2"/>
            <rect x="70" y="128" width="10" height="5" rx="2"/>
            <rect x="160" y="107" width="10" height="5" rx="2"/>
            <rect x="160" y="128" width="10" height="5" rx="2"/>
          </g>
        </g>

        <!-- Junction dots at arc-to-chip touchpoints -->
        <circle cx="96" cy="92" r="3.5" fill="#f0c850"/>
        <circle cx="144" cy="92" r="3.5" fill="#f0c850"/>
        <circle cx="96" cy="148" r="3.5" fill="#5b8def"/>
        <circle cx="144" cy="148" r="3.5" fill="#5b8def"/>
      </svg>
    </div>
    <p class="note">
      芯片 80×80 占画面 1/3 · 弧线纵向延伸<br>
      背景淡弧线增加流动纵深层次<br>
      引脚 @#38bdf8 青色，不与金蓝弧线冲突
    </p>
  </div>
</body>
</html>
