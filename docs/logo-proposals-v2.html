<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR Logo v2 · 方案C细化</title>
<style>
  :root {
    --bg: #0a0e17;
    --card-bg: #121621;
    --border: #1e2533;
    --text: #8896ab;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
  }
  h1 { font-size:1.8rem; font-weight:700; color:#fff; margin-bottom:4px; }
  .sub { color:#6b7c93; font-size:0.85rem; margin-bottom:40px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 60px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    max-width: 420px;
    width: 100%;
  }
  .label { font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.1em; color:#5b8def; }
  .logo-box {
    width: 240px; height: 240px;
    display: flex; align-items: center; justify-content: center;
  }
  .note {
    font-size:0.75rem; color:#5b6d8a; text-align:center; line-height:1.6; max-width:320px;
  }
  .variants {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 20px; margin-top: 40px; max-width: 500px; width: 100%;
  }
  .vcard {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .vlabel { font-size:0.7rem; color:#6b7c93; text-transform:uppercase; letter-spacing:0.08em; }
  .vcard .logo-box { width: 120px; height: 120px; }
</style>
</head>
<body>
  <h1>Asterisk Token Router · 方案C细化</h1>
  <p class="sub">抽象令牌流转 · 双向路由 · 蓝金色系（去紫）</p>

  <!-- Main: 令牌流转 v2 -->
  <div class="card">
    <div class="label">方案 C v2 — 抽象令牌流转</div>
    <div class="logo-box">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f0c850"/>
            <stop offset="100%" style="stop-color:#d4a020"/>
          </linearGradient>
          <linearGradient id="blue" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#5b8def"/>
            <stop offset="100%" style="stop-color:#3060bf"/>
          </linearGradient>
          <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#5b8def"/>
            <stop offset="100%" style="stop-color:#f0c850"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Upper flow: gold tokens flowing right, blue flowing left (crossing) -->
        <g fill="none" stroke-width="6" stroke-linecap="round">
          <!-- Gold path (top→right, thick) -->
          <path d="M30,160 Q60,100 120,100 Q180,100 210,160" stroke="url(#gold)" filter="url(#glow)"/>
          <!-- Blue path (bottom→left, thick) -->
          <path d="M210,80 Q180,140 120,140 Q60,140 30,80" stroke="url(#blue)" filter="url(#glow)"/>
        </g>

        <!-- Endpoints (gold path) -->
        <circle cx="30" cy="160" r="10" fill="url(#gold)" filter="url(#glow)"/>
        <circle cx="210" cy="160" r="10" fill="url(#gold)" filter="url(#glow)"/>

        <!-- Endpoints (blue path) -->
        <circle cx="210" cy="80" r="10" fill="url(#blue)" filter="url(#glow)"/>
        <circle cx="30" cy="80" r="10" fill="url(#blue)" filter="url(#glow)"/>

        <!-- Center hub: where flows cross = routing engine -->
        <circle cx="120" cy="120" r="30" fill="#0a0e17" stroke="url(#center)" stroke-width="4" filter="url(#glow)"/>
        <circle cx="120" cy="120" r="12" fill="url(#center)" filter="url(#glow)"/>

        <!-- Small intermediate nodes on paths -->
        <circle cx="75" cy="112" r="5" fill="url(#gold)" opacity="0.7"/>
        <circle cx="165" cy="112" r="5" fill="url(#gold)" opacity="0.7"/>
        <circle cx="165" cy="128" r="5" fill="url(#blue)" opacity="0.7"/>
        <circle cx="75" cy="128" r="5" fill="url(#blue)" opacity="0.7"/>
      </svg>
    </div>
    <p class="note">
      两条弧形流线交叉于中心 = Token 路由引擎<br>
      金色 = 请求流入 / 蓝色 = 分发输出<br>
      双向流动代表多模型任意调度
    </p>
  </div>

  <!-- 3 color variants -->
  <p class="sub" style="margin-top:40px;">配色变体</p>
  <div class="variants">
    <div class="vcard">
      <div class="vlabel">蓝绿</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <g fill="none" stroke-width="8" stroke-linecap="round">
            <path d="M30,160 Q60,100 120,100 Q180,100 210,160" stroke="#4ade80"/>
            <path d="M210,80 Q180,140 120,140 Q60,140 30,80" stroke="#5b8def"/>
          </g>
          <circle cx="30" cy="160" r="11" fill="#4ade80"/>
          <circle cx="210" cy="160" r="11" fill="#4ade80"/>
          <circle cx="210" cy="80" r="11" fill="#5b8def"/>
          <circle cx="30" cy="80" r="11" fill="#5b8def"/>
          <circle cx="120" cy="120" r="32" fill="#0a0e17" stroke="#4ade80" stroke-width="4"/>
          <circle cx="120" cy="120" r="13" fill="#5b8def"/>
        </svg>
      </div>
    </div>
    <div class="vcard">
      <div class="vlabel">金蓝</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <g fill="none" stroke-width="8" stroke-linecap="round">
            <path d="M30,160 Q60,100 120,100 Q180,100 210,160" stroke="#f0c850"/>
            <path d="M210,80 Q180,140 120,140 Q60,140 30,80" stroke="#5b8def"/>
          </g>
          <circle cx="30" cy="160" r="11" fill="#f0c850"/>
          <circle cx="210" cy="160" r="11" fill="#f0c850"/>
          <circle cx="210" cy="80" r="11" fill="#5b8def"/>
          <circle cx="30" cy="80" r="11" fill="#5b8def"/>
          <circle cx="120" cy="120" r="32" fill="#0a0e17" stroke="#f0c850" stroke-width="4"/>
          <circle cx="120" cy="120" r="13" fill="#5b8def"/>
        </svg>
      </div>
    </div>
    <div class="vcard">
      <div class="vlabel">同色流</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <g fill="none" stroke-width="8" stroke-linecap="round">
            <path d="M30,160 Q60,100 120,100 Q180,100 210,160" stroke="#5b8def"/>
            <path d="M210,80 Q180,140 120,140 Q60,140 30,80" stroke="#3b6dcf"/>
          </g>
          <circle cx="30" cy="160" r="11" fill="#5b8def"/>
          <circle cx="210" cy="160" r="11" fill="#5b8def"/>
          <circle cx="210" cy="80" r="11" fill="#3b6dcf"/>
          <circle cx="30" cy="80" r="11" fill="#3b6dcf"/>
          <circle cx="120" cy="120" r="32" fill="#0a0e17" stroke="#5b8def" stroke-width="4"/>
          <circle cx="120" cy="120" r="13" fill="#5b8def"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
