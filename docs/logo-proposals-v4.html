<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR Logo v4 · C3-A 细化</title>
<style>
  :root {
    --bg: #0a0e17;
    --card-bg: #121621;
    --border: #1e2533;
    --text: #8896ab;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
  }
  h1 { font-size:1.8rem; font-weight:700; color:#fff; margin-bottom:4px; }
  .sub { color:#6b7c93; font-size:0.85rem; margin-bottom:40px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 60px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    max-width: 420px; width: 100%;
  }
  .label { font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.1em; color:#5b8def; }
  .logo-box { width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
  .note { font-size:0.75rem; color:#5b6d8a; text-align:center; line-height:1.6; max-width:320px; }
  .variants {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 20px; margin-top: 40px; max-width: 360px; width: 100%;
  }
  .vcard {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .vlabel { font-size:0.7rem; color:#6b7c93; text-transform:uppercase; letter-spacing:0.08em; }
  .vcard .logo-box { width: 120px; height: 120px; }
</style>
</head>
<body>
  <h1>Asterisk Token Router · v4</h1>
  <p class="sub">粗弧线 + 星标端点 + 六边形放大</p>

  <!-- Main -->
  <div class="card">
    <div class="label">C3-A v4 · 星标路由</div>
    <div class="logo-box">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f0c850"/>
            <stop offset="100%" style="stop-color:#d4a020"/>
          </linearGradient>
          <linearGradient id="blue" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#5b8def"/>
            <stop offset="100%" style="stop-color:#3060bf"/>
          </linearGradient>
          <linearGradient id="centerG" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#5b8def"/>
            <stop offset="100%" style="stop-color:#f0c850"/>
          </linearGradient>
          <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <!-- Reusable asterisk endpoint symbol: 4-line star -->
          <g id="star">
            <line x1="0" y1="-11" x2="0" y2="11" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="-11" y1="0" x2="11" y2="0" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="-8" y1="-8" x2="8" y2="8" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="8" y1="-8" x2="-8" y2="8" stroke-width="3.5" stroke-linecap="round"/>
          </g>
        </defs>

        <!-- 4 converging arcs — EXTRA THICK (16px) -->
        <g fill="none" stroke-width="18" stroke-linecap="round">
          <path d="M55,55 Q125,55 120,120" stroke="url(#gold)" filter="url(#g)"/>
          <path d="M185,55 Q115,55 120,120" stroke="url(#gold)" filter="url(#g)"/>
          <path d="M55,185 Q125,185 120,120" stroke="url(#blue)" filter="url(#g)"/>
          <path d="M185,185 Q115,185 120,120" stroke="url(#blue)" filter="url(#g)"/>
        </g>

        <!-- Endpoint * symbols (replace dots) -->
        <g stroke="url(#gold)" filter="url(#g)">
          <use href="#star" x="55" y="50"/>
          <use href="#star" x="185" y="50"/>
        </g>
        <g stroke="url(#blue)" filter="url(#g)">
          <use href="#star" x="55" y="190"/>
          <use href="#star" x="185" y="190"/>
        </g>

        <!-- Center hexagon — LARGER -->
        <polygon points="120,65 163,90 163,150 120,175 77,150 77,90" fill="#0a0e17" stroke="url(#centerG)" stroke-width="4.5" filter="url(#g)"/>

        <!-- Inner circle with ATR text -->
        <circle cx="120" cy="120" r="24" fill="#121621" stroke="#f0c850" stroke-width="2.5"/>
        <text x="120" y="126" text-anchor="middle" font-size="13" font-weight="800" fill="#fff"
              letter-spacing="3" font-family="monospace">ATR</text>
      </svg>
    </div>
    <p class="note">
      18px 超粗弧线 + 四角星标(*)端点<br>
      六边形放大 50% + ATR 字母居中<br>
      *= 任意渠道 · 六边形 = 路由引擎
    </p>
  </div>

  <!-- Color variants -->
  <p class="sub" style="margin-top:40px;">配色变体</p>
  <div class="variants">
    <div class="vcard">
      <div class="vlabel">纯蓝</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <defs>
            <g id="s2">
              <line x1="0" y1="-9" x2="0" y2="9" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="-9" y1="0" x2="9" y2="0" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="-6.5" y1="-6.5" x2="6.5" y2="6.5" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="6.5" y1="-6.5" x2="-6.5" y2="6.5" stroke-width="3.5" stroke-linecap="round"/>
            </g>
          </defs>
          <g fill="none" stroke-width="20" stroke-linecap="round">
            <path d="M55,55 Q125,55 120,120" stroke="#5b8def"/>
            <path d="M185,55 Q115,55 120,120" stroke="#3b6dcf"/>
            <path d="M55,185 Q125,185 120,120" stroke="#3b6dcf"/>
            <path d="M185,185 Q115,185 120,120" stroke="#5b8def"/>
          </g>
          <g stroke="#5b8def"><use href="#s2" x="55" y="50"/><use href="#s2" x="185" y="50"/></g>
          <g stroke="#3b6dcf"><use href="#s2" x="55" y="190"/><use href="#s2" x="185" y="190"/></g>
          <polygon points="120,65 163,90 163,150 120,175 77,150 77,90" fill="#0a0e17" stroke="#5b8def" stroke-width="5"/>
          <circle cx="120" cy="120" r="24" fill="#121621" stroke="#5b8def" stroke-width="3"/>
          <text x="120" y="126" text-anchor="middle" font-size="13" font-weight="800" fill="#5b8def" letter-spacing="3" font-family="monospace">ATR</text>
        </svg>
      </div>
    </div>
    <div class="vcard">
      <div class="vlabel">蓝绿</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <defs>
            <g id="s3">
              <line x1="0" y1="-9" x2="0" y2="9" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="-9" y1="0" x2="9" y2="0" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="-6.5" y1="-6.5" x2="6.5" y2="6.5" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="6.5" y1="-6.5" x2="-6.5" y2="6.5" stroke-width="3.5" stroke-linecap="round"/>
            </g>
          </defs>
          <g fill="none" stroke-width="20" stroke-linecap="round">
            <path d="M55,55 Q125,55 120,120" stroke="#4ade80"/>
            <path d="M185,55 Q115,55 120,120" stroke="#22c55e"/>
            <path d="M55,185 Q125,185 120,120" stroke="#5b8def"/>
            <path d="M185,185 Q115,185 120,120" stroke="#3b6dcf"/>
          </g>
          <g stroke="#4ade80"><use href="#s3" x="55" y="50"/><use href="#s3" x="185" y="50"/></g>
          <g stroke="#5b8def"><use href="#s3" x="55" y="190"/><use href="#s3" x="185" y="190"/></g>
          <polygon points="120,65 163,90 163,150 120,175 77,150 77,90" fill="#0a0e17" stroke="#4ade80" stroke-width="5"/>
          <circle cx="120" cy="120" r="24" fill="#121621" stroke="#4ade80" stroke-width="3"/>
          <text x="120" y="126" text-anchor="middle" font-size="13" font-weight="800" fill="#4ade80" letter-spacing="3" font-family="monospace">ATR</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
