<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR Logo 方案</title>
<style>
  :root {
    --bg: #0a0e17;
    --surface: #121621;
    --border: #1e2533;
    --text: #c8d1e0;
    --accent: #5b8def;
    --accent-glow: #7aa2ff;
    --gold: #f0c850;
    --green: #4ade80;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
  }
  h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; color:#fff; }
  .sub { color:#6b7c93; font-size:0.9rem; margin-bottom: 48px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 1100px;
    width: 100%;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .label {
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b7c93;
  }
  .logo-wrap { 
    width: 160px; 
    height: 160px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
  }
  .tag {
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid;
  }
  .tag.c { border-color: #4ade80; color: #4ade80; }
  .tag.s { border-color: var(--accent); color: var(--accent); }
  .tag.d { border-color: var(--gold); color: var(--gold); }
  .meta { display: flex; gap: 8px; }
  .favicon-row {
    display: flex; gap: 20px;
    margin-top: 48px;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .favicon-row .label { margin-bottom: 12px; }
  .favicon-row .logo-wrap { width: 64px; height: 64px; }
  .section-title { color:#fff; font-weight:600; font-size:1.1rem; margin: 48px 0 16px; }
</style>
</head>
<body>
  <h1>Asterisk Token Router</h1>
  <p class="sub">Logo 设计方案 — 3 个方向</p>

  <div class="grid">
    <!-- 方案 1: 保守型 — 路由节点 -->
    <div class="card">
      <div class="label">方案 A · 路由节点</div>
      <div class="logo-wrap">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#5b8def"/>
              <stop offset="100%" style="stop-color:#3b6dcf"/>
            </linearGradient>
          </defs>
          <!-- outer ring -->
          <circle cx="80" cy="80" r="70" fill="none" stroke="url(#g1)" stroke-width="4" opacity="0.6"/>
          <!-- inner hex node -->
          <polygon points="80,30 125,57 125,103 80,130 35,103 35,57" 
                   fill="none" stroke="url(#g1)" stroke-width="3.5" opacity="0.9"/>
          <!-- center dot -->
          <circle cx="80" cy="80" r="10" fill="url(#g1)"/>
          <!-- radiating paths -->
          <line x1="80" y1="30" x2="80" y2="10" stroke="url(#g1)" stroke-width="3" opacity="0.7"/>
          <line x1="125" y1="57" x2="145" y2="45" stroke="url(#g1)" stroke-width="3" opacity="0.7"/>
          <line x1="125" y1="103" x2="145" y2="115" stroke="url(#g1)" stroke-width="3" opacity="0.7"/>
          <line x1="80" y1="130" x2="80" y2="150" stroke="url(#g1)" stroke-width="3" opacity="0.7"/>
          <line x1="35" y1="103" x2="15" y2="115" stroke="url(#g1)" stroke-width="3" opacity="0.7"/>
          <line x1="35" y1="57" x2="15" y2="45" stroke="url(#g1)" stroke-width="3" opacity="0.7"/>
          <!-- animated dot on ring -->
          <circle cx="80" cy="10" r="4" fill="#7aa2ff">
            <animate attributeName="cx" values="80;80;80" dur="4s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
      <div class="meta">
        <span class="tag c">保守</span>
        <span class="tag s">科技</span>
      </div>
      <p style="color:#6b7c93;text-align:center;font-size:0.8rem;">
        AI 星图路由 · 六边形节点<br>代表 Token 分发中枢
      </p>
    </div>

    <!-- 方案 2: 最佳匹配 — 星形路由 -->
    <div class="card">
      <div class="label">方案 B · 星形路由</div>
      <div class="logo-wrap">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <defs>
            <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#f0c850"/>
              <stop offset="50%" style="stop-color:#e8a830"/>
              <stop offset="100%" style="stop-color:#5b8def"/>
            </linearGradient>
            <filter id="glow2">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- central hub -->
          <circle cx="80" cy="80" r="28" fill="#121621" stroke="url(#g2)" stroke-width="3" filter="url(#glow2)"/>
          <circle cx="80" cy="80" r="10" fill="url(#g2)"/>
          <!-- star points -->
          <g stroke="url(#g2)" stroke-width="3" filter="url(#glow2)" opacity="0.85">
            <line x1="80" y1="52" x2="80" y2="20"/>
            <line x1="108" y1="80" x2="140" y2="80"/>
            <line x1="80" y1="108" x2="80" y2="140"/>
            <line x1="52" y1="80" x2="20" y2="80"/>
            <line x1="99" y1="61" x2="122" y2="38"/>
            <line x1="99" y1="99" x2="122" y2="122"/>
            <line x1="61" y1="99" x2="38" y2="122"/>
            <line x1="61" y1="61" x2="38" y2="38"/>
          </g>
          <!-- end dots -->
          <circle cx="80" cy="20" r="4" fill="#f0c850" filter="url(#glow2)"/>
          <circle cx="140" cy="80" r="4" fill="#5b8def" filter="url(#glow2)"/>
          <circle cx="80" cy="140" r="4" fill="#f0c850" filter="url(#glow2)"/>
          <circle cx="20" cy="80" r="4" fill="#5b8def" filter="url(#glow2)"/>
          <!-- ATR text -->
          <text x="80" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" 
                letter-spacing="3" font-family="monospace">ATR</text>
        </svg>
      </div>
      <div class="meta">
        <span class="tag s">推荐</span>
        <span class="tag d">独特</span>
      </div>
      <p style="color:#6b7c93;text-align:center;font-size:0.8rem;">
        金蓝双色星形路由 · ATR 字母<br>象征智能分发与价值流转
      </p>
    </div>

    <!-- 方案 3: 激进型 — 抽象箭头流 -->
    <div class="card">
      <div class="label">方案 C · 令牌流转</div>
      <div class="logo-wrap">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <defs>
            <linearGradient id="g3a" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#4ade80"/>
              <stop offset="100%" style="stop-color:#22c55e"/>
            </linearGradient>
            <linearGradient id="g3b" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#5b8def"/>
              <stop offset="100%" style="stop-color:#8b5cf6"/>
            </linearGradient>
          </defs>
          <!-- abstract token flow -->
          <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- path 1: green token -->
            <path d="M30,110 Q55,80 80,80 Q105,80 130,110" stroke="url(#g3a)" opacity="0.8">
              <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
            </path>
            <circle cx="30" cy="110" r="6" fill="url(#g3a)" opacity="0.8"/>
            <circle cx="130" cy="110" r="6" fill="url(#g3a)" opacity="0.8"/>
            <!-- path 2: blue token -->
            <path d="M30,50 Q55,80 80,80 Q105,80 130,50" stroke="url(#g3b)" opacity="0.8">
              <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
            </path>
            <circle cx="30" cy="50" r="6" fill="url(#g3b)" opacity="0.8"/>
            <circle cx="130" cy="50" r="6" fill="url(#g3b)" opacity="0.8"/>
            <!-- center token -->
            <circle cx="80" cy="80" r="12" fill="#121621" stroke="url(#g3b)" stroke-width="3"/>
            <text x="80" y="85" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" 
                  letter-spacing="3" font-family="monospace">ATR</text>
          </g>
        </svg>
      </div>
      <div class="meta">
        <span class="tag d">激进</span>
        <span class="tag c">动态</span>
      </div>
      <p style="color:#6b7c93;text-align:center;font-size:0.8rem;">
        抽象令牌流转 · 双向流动<br>强调路由与转化
      </p>
    </div>
  </div>

  <!-- favicon variants -->
  <p class="section-title">Favicon 适配 (64×64)</p>
  <div class="favicon-row">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <svg width="64" height="64" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="70" fill="none" stroke="#5b8def" stroke-width="5" opacity="0.7"/>
        <polygon points="80,35 120,58 120,102 80,125 40,102 40,58" fill="none" stroke="#5b8def" stroke-width="4"/>
        <circle cx="80" cy="80" r="12" fill="#5b8def"/>
      </svg>
      <span style="font-size:0.7rem;color:#6b7c93;">A · 节点</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <svg width="64" height="64" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="70" fill="none" stroke="#f0c850" stroke-width="5" opacity="0.7"/>
        <circle cx="80" cy="80" r="30" fill="none" stroke="#5b8def" stroke-width="3"/>
        <circle cx="80" cy="80" r="10" fill="#f0c850"/>
      </svg>
      <span style="font-size:0.7rem;color:#6b7c93;">B · 星形</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <svg width="64" height="64" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="70" fill="none" stroke="#4ade80" stroke-width="5" opacity="0.7"/>
        <text x="80" y="90" text-anchor="middle" font-size="40" font-weight="800" fill="#4ade80" 
              letter-spacing="6" font-family="monospace">ATR</text>
      </svg>
      <span style="font-size:0.7rem;color:#6b7c93;">C · 文字</span>
    </div>
  </div>
</body>
</html>
