<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR Logo v3 · 方案C 智能路由</title>
<style>
  :root {
    --bg: #0a0e17;
    --card-bg: #121621;
    --border: #1e2533;
    --text: #8896ab;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
  }
  h1 { font-size:1.8rem; font-weight:700; color:#fff; margin-bottom:4px; }
  .sub { color:#6b7c93; font-size:0.85rem; margin-bottom:40px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 60px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    max-width: 420px; width: 100%;
  }
  .label { font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.1em; color:#5b8def; }
  .logo-box { width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
  .note { font-size:0.75rem; color:#5b6d8a; text-align:center; line-height:1.6; max-width:320px; }
  .variants {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 20px; margin-top: 40px; max-width: 360px; width: 100%;
  }
  .vcard {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .vlabel { font-size:0.7rem; color:#6b7c93; text-transform:uppercase; letter-spacing:0.08em; }
  .vcard .logo-box { width: 120px; height: 120px; }
</style>
</head>
<body>
  <h1>Asterisk Token Router · v3 智能路由</h1>
  <p class="sub">多向汇聚 · 神经网络拓扑 · 粗线</p>

  <!-- A: Neural convergence — 4 thick arcs converge into a hexagonal processor -->
  <div class="card" style="margin-bottom:24px;">
    <div class="label">方案 C3-A · 神经网络拓扑</div>
    <div class="logo-box">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f0c850"/>
            <stop offset="100%" style="stop-color:#d4a020"/>
          </linearGradient>
          <linearGradient id="ab" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#5b8def"/>
            <stop offset="100%" style="stop-color:#3060bf"/>
          </linearGradient>
          <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- 4 thick converging arcs -->
        <g fill="none" stroke-width="12" stroke-linecap="round">
          <!-- Top-left → center -->
          <path d="M50,50 Q120,60 120,120" stroke="url(#ag)" filter="url(#g)"/>
          <!-- Top-right → center -->
          <path d="M190,50 Q120,60 120,120" stroke="url(#ag)" filter="url(#g)"/>
          <!-- Bottom-left → center -->
          <path d="M50,190 Q120,180 120,120" stroke="url(#ab)" filter="url(#g)"/>
          <!-- Bottom-right → center -->
          <path d="M190,190 Q120,180 120,120" stroke="url(#ab)" filter="url(#g)"/>
        </g>

        <!-- Endpoint nodes -->
        <g filter="url(#g)">
          <circle cx="50" cy="50" r="12" fill="url(#ag)"/>
          <circle cx="190" cy="50" r="12" fill="url(#ag)"/>
          <circle cx="50" cy="190" r="12" fill="url(#ab)"/>
          <circle cx="190" cy="190" r="12" fill="url(#ab)"/>
        </g>

        <!-- Center processor: hexagon + inner circle -->
        <polygon points="120,80 155,100 155,140 120,160 85,140 85,100" fill="#0a0e17" stroke="url(#ab)" stroke-width="4"/>
        <circle cx="120" cy="120" r="16" fill="#121621" stroke="#f0c850" stroke-width="3"/>
        <circle cx="120" cy="120" r="6" fill="url(#ag)"/>
      </svg>
    </div>
    <p class="note">
      4 条粗弧线汇聚于六边形处理器<br>
      金色 = 上游请求 · 蓝色 = 下游分发<br>
      神经网络拓扑隐喻智能路由
    </p>
  </div>

  <!-- B: Constellation — 6 nodes connected by thick arcs around a central hub -->
  <div class="card">
    <div class="label">方案 C3-B · 星座网络</div>
    <div class="logo-box">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <defs>
          <filter id="g2"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- Outer arcs connecting nodes in a ring -->
        <g fill="none" stroke-linecap="round" filter="url(#g2)">
          <!-- Ring arcs -->
          <path d="M120,28 Q170,40 196,76" stroke="#5b8def" stroke-width="10" opacity="0.5"/>
          <path d="M196,76 Q215,120 196,164" stroke="#5b8def" stroke-width="10" opacity="0.5"/>
          <path d="M196,164 Q170,200 120,212" stroke="#5b8def" stroke-width="10" opacity="0.5"/>
          <path d="M120,212 Q70,200 44,164" stroke="#5b8def" stroke-width="10" opacity="0.5"/>
          <path d="M44,164 Q25,120 44,76" stroke="#5b8def" stroke-width="10" opacity="0.5"/>
          <path d="M44,76 Q70,40 120,28" stroke="#5b8def" stroke-width="10" opacity="0.5"/>

          <!-- Spokes from perimeter nodes to center -->
          <line x1="120" y1="28" x2="120" y2="120" stroke="#f0c850" stroke-width="10"/>
          <line x1="196" y1="76" x2="120" y2="120" stroke="#f0c850" stroke-width="10"/>
          <line x1="196" y1="164" x2="120" y2="120" stroke="#f0c850" stroke-width="10"/>
          <line x1="120" y1="212" x2="120" y2="120" stroke="#f0c850" stroke-width="10"/>
          <line x1="44" y1="164" x2="120" y2="120" stroke="#f0c850" stroke-width="10"/>
          <line x1="44" y1="76" x2="120" y2="120" stroke="#f0c850" stroke-width="10"/>
        </g>

        <!-- 6 perimeter nodes -->
        <g fill="#5b8def" filter="url(#g2)">
          <circle cx="120" cy="28" r="10"/>
          <circle cx="196" cy="76" r="10"/>
          <circle cx="196" cy="164" r="10"/>
          <circle cx="120" cy="212" r="10"/>
          <circle cx="44" cy="164" r="10"/>
          <circle cx="44" cy="76" r="10"/>
        </g>

        <!-- Center hub -->
        <circle cx="120" cy="120" r="28" fill="#0a0e17" stroke="#f0c850" stroke-width="4" filter="url(#g2)"/>
        <circle cx="120" cy="120" r="12" fill="#f0c850" filter="url(#g2)"/>
      </svg>
    </div>
    <p class="note">
      6 节点环绕 + 辐条汇聚 → 中心路由引擎<br>
      蓝色环 = 模型池 · 金色辐条 = Token 分发<br>
      智能路由 = 任意节点可达中心
    </p>
  </div>

  <!-- Color variants -->
  <p class="sub" style="margin-top:40px;">配色变体 (C3-A)</p>
  <div class="variants">
    <div class="vcard">
      <div class="vlabel">蓝金</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <g fill="none" stroke-width="14" stroke-linecap="round">
            <path d="M50,50 Q120,60 120,120" stroke="#f0c850"/>
            <path d="M190,50 Q120,60 120,120" stroke="#f0c850"/>
            <path d="M50,190 Q120,180 120,120" stroke="#5b8def"/>
            <path d="M190,190 Q120,180 120,120" stroke="#5b8def"/>
          </g>
          <circle cx="50" cy="50" r="14" fill="#f0c850"/>
          <circle cx="190" cy="50" r="14" fill="#f0c850"/>
          <circle cx="50" cy="190" r="14" fill="#5b8def"/>
          <circle cx="190" cy="190" r="14" fill="#5b8def"/>
          <polygon points="120,80 155,100 155,140 120,160 85,140 85,100" fill="#0a0e17" stroke="#5b8def" stroke-width="5"/>
          <circle cx="120" cy="120" r="8" fill="#f0c850"/>
        </svg>
      </div>
    </div>
    <div class="vcard">
      <div class="vlabel">纯蓝</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <g fill="none" stroke-width="14" stroke-linecap="round">
            <path d="M50,50 Q120,60 120,120" stroke="#5b8def"/>
            <path d="M190,50 Q120,60 120,120" stroke="#3b6dcf"/>
            <path d="M50,190 Q120,180 120,120" stroke="#3b6dcf"/>
            <path d="M190,190 Q120,180 120,120" stroke="#5b8def"/>
          </g>
          <circle cx="50" cy="50" r="14" fill="#5b8def"/>
          <circle cx="190" cy="50" r="14" fill="#3b6dcf"/>
          <circle cx="50" cy="190" r="14" fill="#3b6dcf"/>
          <circle cx="190" cy="190" r="14" fill="#5b8def"/>
          <polygon points="120,80 155,100 155,140 120,160 85,140 85,100" fill="#0a0e17" stroke="#5b8def" stroke-width="5"/>
          <circle cx="120" cy="120" r="8" fill="#5b8def"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
