<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR Logo v6 · 芯片放大</title>
<style>
  :root {
    --bg: #0a0e17;
    --card-bg: #121621;
    --border: #1e2533;
    --text: #8896ab;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
  }
  h1 { font-size:1.8rem; font-weight:700; color:#fff; margin-bottom:4px; }
  .sub { color:#6b7c93; font-size:0.85rem; margin-bottom:40px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 60px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    max-width: 420px; width: 100%; margin-bottom: 24px;
  }
  .label { font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.1em; color:#5b8def; }
  .logo-box { width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
  .note { font-size:0.75rem; color:#5b6d8a; text-align:center; line-height:1.6; max-width:320px; }
  .variants {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 20px; margin-top: 40px; max-width: 360px; width: 100%;
  }
  .vcard {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .vlabel { font-size:0.7rem; color:#6b7c93; text-transform:uppercase; letter-spacing:0.08em; }
  .vcard .logo-box { width: 120px; height: 120px; }
</style>
</head>
<body>
  <h1>Asterisk Token Router · v6 芯片放大</h1>
  <p class="sub">V3-A 四弧线 + V5-C 芯片 + 末端圆点</p>

  <!-- Main -->
  <div class="card">
    <div class="label">芯片路由</div>
    <div class="logo-box">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f0c850"/>
            <stop offset="100%" style="stop-color:#d4a020"/>
          </linearGradient>
          <linearGradient id="blue" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#5b8def"/>
            <stop offset="100%" style="stop-color:#3060bf"/>
          </linearGradient>
          <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- 4 converging thick arcs (V3-A style) -->
        <g fill="none" stroke-width="16" stroke-linecap="round">
          <path d="M55,55 Q125,50 120,120" stroke="url(#gold)" filter="url(#g)"/>
          <path d="M185,55 Q115,50 120,120" stroke="url(#gold)" filter="url(#g)"/>
          <path d="M55,185 Q125,190 120,120" stroke="url(#blue)" filter="url(#g)"/>
          <path d="M185,185 Q115,190 120,120" stroke="url(#blue)" filter="url(#g)"/>
        </g>

        <!-- Endpoint dots (V3-A style, no stars) -->
        <g filter="url(#g)">
          <circle cx="55" cy="55" r="14" fill="url(#gold)"/>
          <circle cx="185" cy="55" r="14" fill="url(#gold)"/>
          <circle cx="55" cy="185" r="14" fill="url(#blue)"/>
          <circle cx="185" cy="185" r="14" fill="url(#blue)"/>
        </g>

        <!-- LARGE chip processor center -->
        <g filter="url(#g)">
          <!-- Outer chip body -->
          <rect x="82" y="82" width="76" height="76" rx="6" fill="#0a0e17" stroke="url(#gold)" stroke-width="4"/>
          <!-- Inner die -->
          <rect x="98" y="98" width="44" height="44" rx="3" fill="#121621" stroke="#5b8def" stroke-width="3"/>
          <!-- Core glow dot -->
          <circle cx="120" cy="120" r="10" fill="url(#gold)"/>

          <!-- Pins — top / bottom / left / right -->
          <g fill="#5b8def" opacity="0.85">
            <!-- top pins -->
            <rect x="97" y="72" width="4" height="10" rx="1.5"/>
            <rect x="105" y="72" width="4" height="10" rx="1.5"/>
            <rect x="113" y="72" width="4" height="10" rx="1.5"/>
            <rect x="121" y="72" width="4" height="10" rx="1.5"/>
            <rect x="129" y="72" width="4" height="10" rx="1.5"/>
            <rect x="137" y="72" width="4" height="10" rx="1.5"/>
            <!-- bottom pins -->
            <rect x="97" y="158" width="4" height="10" rx="1.5"/>
            <rect x="105" y="158" width="4" height="10" rx="1.5"/>
            <rect x="113" y="158" width="4" height="10" rx="1.5"/>
            <rect x="121" y="158" width="4" height="10" rx="1.5"/>
            <rect x="129" y="158" width="4" height="10" rx="1.5"/>
            <rect x="137" y="158" width="4" height="10" rx="1.5"/>
            <!-- left pins -->
            <rect x="72" y="97" width="10" height="4" rx="1.5"/>
            <rect x="72" y="105" width="10" height="4" rx="1.5"/>
            <rect x="72" y="113" width="10" height="4" rx="1.5"/>
            <rect x="72" y="121" width="10" height="4" rx="1.5"/>
            <rect x="72" y="129" width="10" height="4" rx="1.5"/>
            <rect x="72" y="137" width="10" height="4" rx="1.5"/>
            <!-- right pins -->
            <rect x="158" y="97" width="10" height="4" rx="1.5"/>
            <rect x="158" y="105" width="10" height="4" rx="1.5"/>
            <rect x="158" y="113" width="10" height="4" rx="1.5"/>
            <rect x="158" y="121" width="10" height="4" rx="1.5"/>
            <rect x="158" y="129" width="10" height="4" rx="1.5"/>
            <rect x="158" y="137" width="10" height="4" rx="1.5"/>
          </g>

          <!-- Corner accent dots -->
          <circle cx="90" cy="90" r="2.5" fill="#f0c850"/>
          <circle cx="150" cy="90" r="2.5" fill="#f0c850"/>
          <circle cx="90" cy="150" r="2.5" fill="#f0c850"/>
          <circle cx="150" cy="150" r="2.5" fill="#f0c850"/>
        </g>
      </svg>
    </div>
    <p class="note">
      76×76 放大芯片 + 24 引脚 = 多模型接入<br>
      金色外框 · 蓝色内核 · 金色芯点<br>
      四角圆点 = 上游渠道
    </p>
  </div>

  <!-- Color variants -->
  <p class="sub" style="margin-top:40px;">配色变体</p>
  <div class="variants">
    <div class="vcard">
      <div class="vlabel">纯蓝</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <g fill="none" stroke-width="18" stroke-linecap="round">
            <path d="M55,55 Q125,50 120,120" stroke="#5b8def"/>
            <path d="M185,55 Q115,50 120,120" stroke="#3b6dcf"/>
            <path d="M55,185 Q125,190 120,120" stroke="#3b6dcf"/>
            <path d="M185,185 Q115,190 120,120" stroke="#5b8def"/>
          </g>
          <circle cx="55" cy="55" r="16" fill="#5b8def"/>
          <circle cx="185" cy="55" r="16" fill="#3b6dcf"/>
          <circle cx="55" cy="185" r="16" fill="#3b6dcf"/>
          <circle cx="185" cy="185" r="16" fill="#5b8def"/>
          <rect x="82" y="82" width="76" height="76" rx="6" fill="#0a0e17" stroke="#5b8def" stroke-width="5"/>
          <rect x="98" y="98" width="44" height="44" rx="3" fill="#121621" stroke="#5b8def" stroke-width="3"/>
          <circle cx="120" cy="120" r="11" fill="#5b8def"/>
          <g fill="#5b8def" opacity="0.8">
            <rect x="97" y="72" width="4" height="10" rx="1"/><rect x="113" y="72" width="4" height="10" rx="1"/>
            <rect x="129" y="72" width="4" height="10" rx="1"/>
            <rect x="97" y="158" width="4" height="10" rx="1"/><rect x="113" y="158" width="4" height="10" rx="1"/>
            <rect x="129" y="158" width="4" height="10" rx="1"/>
            <rect x="72" y="97" width="10" height="4" rx="1"/><rect x="72" y="113" width="10" height="4" rx="1"/>
            <rect x="72" y="129" width="10" height="4" rx="1"/>
            <rect x="158" y="97" width="10" height="4" rx="1"/><rect x="158" y="113" width="10" height="4" rx="1"/>
            <rect x="158" y="129" width="10" height="4" rx="1"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="vcard">
      <div class="vlabel">蓝绿</div>
      <div class="logo-box">
        <svg width="120" height="120" viewBox="0 0 240 240">
          <g fill="none" stroke-width="18" stroke-linecap="round">
            <path d="M55,55 Q125,50 120,120" stroke="#4ade80"/>
            <path d="M185,55 Q115,50 120,120" stroke="#22c55e"/>
            <path d="M55,185 Q125,190 120,120" stroke="#5b8def"/>
            <path d="M185,185 Q115,190 120,120" stroke="#3b6dcf"/>
          </g>
          <circle cx="55" cy="55" r="16" fill="#4ade80"/>
          <circle cx="185" cy="55" r="16" fill="#22c55e"/>
          <circle cx="55" cy="185" r="16" fill="#5b8def"/>
          <circle cx="185" cy="185" r="16" fill="#3b6dcf"/>
          <rect x="82" y="82" width="76" height="76" rx="6" fill="#0a0e17" stroke="#4ade80" stroke-width="5"/>
          <rect x="98" y="98" width="44" height="44" rx="3" fill="#121621" stroke="#4ade80" stroke-width="3"/>
          <circle cx="120" cy="120" r="11" fill="#4ade80"/>
          <g fill="#4ade80" opacity="0.8">
            <rect x="97" y="72" width="4" height="10" rx="1"/><rect x="113" y="72" width="4" height="10" rx="1"/>
            <rect x="129" y="72" width="4" height="10" rx="1"/>
            <rect x="97" y="158" width="4" height="10" rx="1"/><rect x="113" y="158" width="4" height="10" rx="1"/>
            <rect x="129" y="158" width="4" height="10" rx="1"/>
            <rect x="72" y="97" width="10" height="4" rx="1"/><rect x="72" y="113" width="10" height="4" rx="1"/>
            <rect x="72" y="129" width="10" height="4" rx="1"/>
            <rect x="158" y="97" width="10" height="4" rx="1"/><rect x="158" y="113" width="10" height="4" rx="1"/>
            <rect x="158" y="129" width="10" height="4" rx="1"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
