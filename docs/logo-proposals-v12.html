<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR Logo v12 · 三配色 + Icon</title>
<style>
  :root { --bg:#0a0e17; --card-bg:#121621; --border:#1e2533; --text:#8896ab; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px; min-height: 100vh;
  }
  h1 { font-size:1.8rem; font-weight:700; color:#fff; margin-bottom:4px; }
  .sub { color:#6b7c93; font-size:0.85rem; margin-bottom:40px; }
  .row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 20px; max-width: 620px; width: 100%; margin-bottom: 24px;
  }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .label { font-weight:600; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em; color:#5b8def; }
  .logo-box { width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }
  .note { font-size:0.7rem; color:#5b6d8a; text-align:center; line-height:1.5; }

  .icons {
    display: flex; gap: 24px; margin-top: 48px;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 40px; align-items: center;
  }
  .icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .icon-label { font-size:0.65rem; color:#5b6d8a; text-transform:uppercase; letter-spacing:0.06em; }
  .section-title { color:#fff; font-weight:600; font-size:1rem; margin: 40px 0 16px; }
</style>
</head>
<body>
  <h1>Asterisk Token Router · v12</h1>
  <p class="sub">大弧度 · 三配色 · 缩小 Icon</p>

  <!-- 3 color variants -->
  <div class="row">
    <!-- A: 金蓝 — recommended -->
    <div class="card">
      <div class="label">A · 金蓝</div>
      <div class="logo-box">
        <svg width="160" height="160" viewBox="0 0 240 240">
          <defs>
            <filter id="ga"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <g fill="none" stroke-width="17" stroke-linecap="round">
            <path d="M56,44 Q110,70 100,92" stroke="#f0c850" filter="url(#ga)"/>
            <path d="M184,44 Q130,70 140,92" stroke="#f0c850" filter="url(#ga)"/>
            <path d="M56,196 Q110,170 100,148" stroke="#5b8def" filter="url(#ga)"/>
            <path d="M184,196 Q130,170 140,148" stroke="#5b8def" filter="url(#ga)"/>
          </g>
          <g filter="url(#ga)">
            <circle cx="56" cy="44" r="12" fill="#f0c850"/>
            <circle cx="184" cy="44" r="12" fill="#f0c850"/>
            <circle cx="56" cy="196" r="12" fill="#5b8def"/>
            <circle cx="184" cy="196" r="12" fill="#5b8def"/>
          </g>
          <g filter="url(#ga)">
            <rect x="80" y="80" width="80" height="80" rx="9" fill="#0a0e17" stroke="#f0c850" stroke-width="5"/>
            <rect x="96" y="96" width="48" height="48" rx="5" fill="#121621" stroke="#5b8def" stroke-width="3"/>
            <circle cx="120" cy="120" r="10" fill="#f0c850"/>
            <g fill="#38bdf8" opacity="0.9">
              <rect x="107" y="70" width="5" height="10" rx="2"/><rect x="128" y="70" width="5" height="10" rx="2"/>
              <rect x="107" y="160" width="5" height="10" rx="2"/><rect x="128" y="160" width="5" height="10" rx="2"/>
              <rect x="70" y="107" width="10" height="5" rx="2"/><rect x="70" y="128" width="10" height="5" rx="2"/>
              <rect x="160" y="107" width="10" height="5" rx="2"/><rect x="160" y="128" width="10" height="5" rx="2"/>
            </g>
          </g>
          <circle cx="100" cy="92" r="3.5" fill="#f0c850"/>
          <circle cx="140" cy="92" r="3.5" fill="#f0c850"/>
          <circle cx="100" cy="148" r="3.5" fill="#5b8def"/>
          <circle cx="140" cy="148" r="3.5" fill="#5b8def"/>
        </svg>
      </div>
      <p class="note">金弧(上游) · 蓝弧(分发)<br>青色引脚 · 经典科技</p>
    </div>

    <!-- B: 翠蓝 -->
    <div class="card">
      <div class="label">B · 翠蓝</div>
      <div class="logo-box">
        <svg width="160" height="160" viewBox="0 0 240 240">
          <defs><filter id="gb"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <g fill="none" stroke-width="17" stroke-linecap="round">
            <path d="M56,44 Q110,70 100,92" stroke="#4ade80" filter="url(#gb)"/>
            <path d="M184,44 Q130,70 140,92" stroke="#22c55e" filter="url(#gb)"/>
            <path d="M56,196 Q110,170 100,148" stroke="#5b8def" filter="url(#gb)"/>
            <path d="M184,196 Q130,170 140,148" stroke="#3b6dcf" filter="url(#gb)"/>
          </g>
          <g filter="url(#gb)">
            <circle cx="56" cy="44" r="12" fill="#4ade80"/>
            <circle cx="184" cy="44" r="12" fill="#22c55e"/>
            <circle cx="56" cy="196" r="12" fill="#5b8def"/>
            <circle cx="184" cy="196" r="12" fill="#3b6dcf"/>
            <rect x="80" y="80" width="80" height="80" rx="9" fill="#0a0e17" stroke="#4ade80" stroke-width="5"/>
            <rect x="96" y="96" width="48" height="48" rx="5" fill="#121621" stroke="#5b8def" stroke-width="3"/>
            <circle cx="120" cy="120" r="10" fill="#4ade80"/>
            <g fill="#f0c850" opacity="0.85">
              <rect x="107" y="70" width="5" height="10" rx="2"/><rect x="128" y="70" width="5" height="10" rx="2"/>
              <rect x="107" y="160" width="5" height="10" rx="2"/><rect x="128" y="160" width="5" height="10" rx="2"/>
              <rect x="70" y="107" width="10" height="5" rx="2"/><rect x="70" y="128" width="10" height="5" rx="2"/>
              <rect x="160" y="107" width="10" height="5" rx="2"/><rect x="160" y="128" width="10" height="5" rx="2"/>
            </g>
          </g>
          <circle cx="100" cy="92" r="3.5" fill="#4ade80"/>
          <circle cx="140" cy="92" r="3.5" fill="#22c55e"/>
          <circle cx="100" cy="148" r="3.5" fill="#5b8def"/>
          <circle cx="140" cy="148" r="3.5" fill="#3b6dcf"/>
        </svg>
      </div>
      <p class="note">翠弧 · 蓝弧 · 金色引脚<br>清新明快</p>
    </div>

    <!-- C: 纯蓝紫 -->
    <div class="card">
      <div class="label">C · 蓝紫</div>
      <div class="logo-box">
        <svg width="160" height="160" viewBox="0 0 240 240">
          <defs><filter id="gc"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <g fill="none" stroke-width="17" stroke-linecap="round">
            <path d="M56,44 Q110,70 100,92" stroke="#818cf8" filter="url(#gc)"/>
            <path d="M184,44 Q130,70 140,92" stroke="#6366f1" filter="url(#gc)"/>
            <path d="M56,196 Q110,170 100,148" stroke="#5b8def" filter="url(#gc)"/>
            <path d="M184,196 Q130,170 140,148" stroke="#3b6dcf" filter="url(#gc)"/>
          </g>
          <g filter="url(#gc)">
            <circle cx="56" cy="44" r="12" fill="#818cf8"/>
            <circle cx="184" cy="44" r="12" fill="#6366f1"/>
            <circle cx="56" cy="196" r="12" fill="#5b8def"/>
            <circle cx="184" cy="196" r="12" fill="#3b6dcf"/>
            <rect x="80" y="80" width="80" height="80" rx="9" fill="#0a0e17" stroke="#818cf8" stroke-width="5"/>
            <rect x="96" y="96" width="48" height="48" rx="5" fill="#121621" stroke="#5b8def" stroke-width="3"/>
            <circle cx="120" cy="120" r="10" fill="#818cf8"/>
            <g fill="#38bdf8" opacity="0.9">
              <rect x="107" y="70" width="5" height="10" rx="2"/><rect x="128" y="70" width="5" height="10" rx="2"/>
              <rect x="107" y="160" width="5" height="10" rx="2"/><rect x="128" y="160" width="5" height="10" rx="2"/>
              <rect x="70" y="107" width="10" height="5" rx="2"/><rect x="70" y="128" width="10" height="5" rx="2"/>
              <rect x="160" y="107" width="10" height="5" rx="2"/><rect x="160" y="128" width="10" height="5" rx="2"/>
            </g>
          </g>
          <circle cx="100" cy="92" r="3.5" fill="#818cf8"/>
          <circle cx="140" cy="92" r="3.5" fill="#6366f1"/>
          <circle cx="100" cy="148" r="3.5" fill="#5b8def"/>
          <circle cx="140" cy="148" r="3.5" fill="#3b6dcf"/>
        </svg>
      </div>
      <p class="note">靛弧 · 蓝弧 · 青色引脚<br>深邃科技感</p>
    </div>
  </div>

  <!-- Icon sizes -->
  <p class="section-title">缩小 Icon</p>
  <div class="icons">
    <div class="icon-wrap">
      <svg width="96" height="96" viewBox="0 0 240 240">
        <g fill="none" stroke-width="20" stroke-linecap="round">
          <path d="M56,44 Q110,70 100,92" stroke="#f0c850"/>
          <path d="M184,44 Q130,70 140,92" stroke="#f0c850"/>
          <path d="M56,196 Q110,170 100,148" stroke="#5b8def"/>
          <path d="M184,196 Q130,170 140,148" stroke="#5b8def"/>
        </g>
        <circle cx="56" cy="44" r="14" fill="#f0c850"/>
        <circle cx="184" cy="44" r="14" fill="#f0c850"/>
        <circle cx="56" cy="196" r="14" fill="#5b8def"/>

        <rect x="80" y="80" width="80" height="80" rx="9" fill="#0a0e17" stroke="#f0c850" stroke-width="6"/>
        <circle cx="120" cy="120" r="13" fill="#f0c850"/>
        <circle cx="100" cy="92" r="4.5" fill="#f0c850"/>
        <circle cx="140" cy="92" r="4.5" fill="#f0c850"/>
        <circle cx="100" cy="148" r="4.5" fill="#5b8def"/>
        <circle cx="140" cy="148" r="4.5" fill="#5b8def"/>
      </svg>
      <span class="icon-label">96×96</span>
    </div>
    <div class="icon-wrap">
      <svg width="64" height="64" viewBox="0 0 240 240">
        <g fill="none" stroke-width="22" stroke-linecap="round">
          <path d="M56,44 Q110,70 100,92" stroke="#f0c850"/>
          <path d="M184,44 Q130,70 140,92" stroke="#f0c850"/>
          <path d="M56,196 Q110,170 100,148" stroke="#5b8def"/>
          <path d="M184,196 Q130,170 140,148" stroke="#5b8def"/>
        </g>
        <circle cx="56" cy="44" r="15" fill="#f0c850"/>
        <circle cx="184" cy="44" r="15" fill="#f0c850"/>
        <circle cx="56" cy="196" r="15" fill="#5b8def"/>
        <circle cx="184" cy="196" r="15" fill="#5b8def"/>
        <rect x="78" y="78" width="84" height="84" rx="10" fill="#0a0e17" stroke="#f0c850" stroke-width="7"/>
        <circle cx="120" cy="120" r="16" fill="#f0c850"/>
        <circle cx="98" cy="90" r="5" fill="#f0c850"/>
        <circle cx="142" cy="90" r="5" fill="#f0c850"/>
        <circle cx="98" cy="150" r="5" fill="#5b8def"/>
        <circle cx="142" cy="150" r="5" fill="#5b8def"/>
      </svg>
      <span class="icon-label">64×64</span>
    </div>
    <div class="icon-wrap">
      <svg width="32" height="32" viewBox="0 0 240 240">
        <g fill="none" stroke-width="26" stroke-linecap="round">
          <path d="M56,44 Q110,70 100,92" stroke="#f0c850"/>
          <path d="M184,44 Q130,70 140,92" stroke="#f0c850"/>
          <path d="M56,196 Q110,170 100,148" stroke="#5b8def"/>
          <path d="M184,196 Q130,170 140,148" stroke="#5b8def"/>
        </g>
        <circle cx="56" cy="44" r="17" fill="#f0c850"/>
        <circle cx="184" cy="44" r="17" fill="#f0c850"/>
        <circle cx="56" cy="196" r="17" fill="#5b8def"/>
        <circle cx="184" cy="196" r="17" fill="#5b8def"/>
        <rect x="74" y="74" width="92" height="92" rx="12" fill="#0a0e17" stroke="#f0c850" stroke-width="8"/>
        <circle cx="120" cy="120" r="20" fill="#f0c850"/>

      <span class="icon-label">32×32</span>

  </div>
</body>
</html>
