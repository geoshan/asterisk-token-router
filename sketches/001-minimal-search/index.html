<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>esgbot · ESG评级检索</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:'#0ea5e9',accent:'#06b6d4'}}}}</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;color:#1e293b;background:#f8fafc;min-height:100vh;display:flex;flex-direction:column}
  .search-box{transition:box-shadow .2s}
  .search-box:focus-within{box-shadow:0 4px 24px rgba(14,165,233,.15)}
  .company-row:hover{background:#f0f9ff}
  .tag{transition:all .15s}
  .tag:hover{transform:translateY(-1px)}
</style>
</head>
<body class="flex flex-col items-center justify-center flex-1 px-4">
  
  <!-- logo + search -->
  <div class="text-center w-full max-w-3xl -mt-16">
    <div class="mb-10">
      <h1 class="text-4xl font-bold text-slate-800 tracking-tight">
        esgbot<span class="text-brand">.</span>cn
      </h1>
      <p class="text-slate-400 mt-2 text-sm">中国上市公司 ESG 评级智能检索</p>
    </div>

    <!-- search -->
    <div class="search-box relative bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div class="flex items-center px-5 py-4">
        <svg class="w-5 h-5 text-slate-300 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="search" placeholder="输入公司全称或简称，如 宁德时代、贵州茅台…" 
               class="flex-1 text-lg text-slate-700 outline-none bg-transparent placeholder:text-slate-300"
               autocomplete="off" autofocus>
        <button onclick="search()" class="ml-3 bg-brand hover:bg-cyan-600 text-white px-6 py-2 rounded-xl text-sm font-medium transition-colors">搜索</button>
      </div>
      <!-- search results dropdown -->
      <div id="results" class="hidden border-t border-slate-100 max-h-80 overflow-y-auto"></div>
    </div>

    <!-- hot tags -->
    <div class="flex flex-wrap gap-2 justify-center mt-5">
      <span class="tag text-xs bg-white border border-slate-200 text-slate-500 rounded-full px-3 py-1 cursor-pointer hover:border-brand hover:text-brand">宁德时代</span>
      <span class="tag text-xs bg-white border border-slate-200 text-slate-500 rounded-full px-3 py-1 cursor-pointer hover:border-brand hover:text-brand">贵州茅台</span>
      <span class="tag text-xs bg-white border border-slate-200 text-slate-500 rounded-full px-3 py-1 cursor-pointer hover:border-brand hover:text-brand">比亚迪</span>
      <span class="tag text-xs bg-white border border-slate-200 text-slate-500 rounded-full px-3 py-1 cursor-pointer hover:border-brand hover:text-brand">中国平安</span>
      <span class="tag text-xs bg-white border border-slate-200 text-slate-500 rounded-full px-3 py-1 cursor-pointer hover:border-brand hover:text-brand">隆基绿能</span>
    </div>
  </div>

  <!-- footer -->
  <div class="mt-auto py-6 text-center text-xs text-slate-300">
    esgbot.cn · 上海锐钝信息科技 · 沪ICP备2025119352号-1
  </div>

<script>
const companies = [
  {name:'宁德时代',code:'300750',rating:'AAA',score:88,area:'新能源'},
  {name:'贵州茅台',code:'600519',rating:'AA',score:75,area:'白酒'},
  {name:'比亚迪',code:'002594',rating:'AA',score:82,area:'新能源车'},
  {name:'隆基绿能',code:'601012',rating:'AAA',score:91,area:'光伏'},
  {name:'中国平安',code:'601318',rating:'A',score:68,area:'金融'},
  {name:'恒瑞医药',code:'600276',rating:'BBB',score:55,area:'医药'},
];

document.getElementById('search').addEventListener('input',function(e){
  const q=e.target.value.trim();
  const r=document.getElementById('results');
  if(q.length<1){r.classList.add('hidden');return}
  r.classList.remove('hidden');
  const m=companies.filter(c=>c.name.includes(q)||c.code.includes(q));
  r.innerHTML=m.length?m.map(c=>`
    <div class="company-row flex items-center justify-between px-5 py-3 cursor-pointer border-b border-slate-50 last:border-0" onclick="select('${c.name}')">
      <div class="flex items-center gap-3">
        <span class="font-medium text-slate-700 text-sm">${c.name}</span>
        <span class="text-xs text-slate-400">${c.code}</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-xs text-slate-400">${c.area}</span>
        <span class="px-2 py-0.5 rounded text-xs font-bold ${c.rating==='AAA'?'bg-green-100 text-green-700':c.rating==='AA'?'bg-blue-50 text-blue-600':'bg-amber-50 text-amber-600'}">${c.rating}</span>
        <span class="text-xs text-slate-500">${c.score}分</span>
      </div>
    </div>`).join(''):'<div class="p-4 text-center text-slate-300 text-sm">未找到匹配公司</div>';
});

document.querySelectorAll('.tag').forEach(t=>{
  t.addEventListener('click',function(){document.getElementById('search').value=this.textContent;search()});
});

function search(){const q=document.getElementById('search').value.trim();if(q){alert('跳转至: '+q+' 的 ESG 详情页')}}
function select(name){document.getElementById('search').value=name;search()}
</script>
</body>
</html>
